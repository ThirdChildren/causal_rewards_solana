[workspace]
resolver = "2"
members = [
    "crates/crp-crypto",
    "programs/experiment-registry",
    "programs/evidence-registry",
    "programs/settlement",
    "programs/challenge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
crp-crypto = { path = "crates/crp-crypto" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
