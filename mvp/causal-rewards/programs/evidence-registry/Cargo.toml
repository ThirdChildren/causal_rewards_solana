[package]
name = "evidence-registry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Causal Rewards Protocol — evidence registry (per-epoch batch roots, time ranges, signer commitments, aggregate counts)."

[lib]
crate-type = ["cdylib", "lib"]
name = "evidence_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "experiment-registry/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
experiment-registry = { path = "../experiment-registry", features = ["cpi"] }
