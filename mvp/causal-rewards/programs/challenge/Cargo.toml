[package]
name = "challenge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Causal Rewards Protocol — challenge (bond escrow, finality pause, resolution per frozen policy)."

[lib]
crate-type = ["cdylib", "lib"]
name = "challenge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "experiment-registry/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
experiment-registry = { path = "../experiment-registry", features = ["cpi"] }
