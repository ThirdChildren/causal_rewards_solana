[package]
name = "crp-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared canonical hashing / Merkle / seed-commitment / assignment derivation for the Causal Rewards Protocol. Byte-for-byte identical to specs/serialization.md and the verifier reference. No second encoder."

[lib]
crate-type = ["lib"]
name = "crp_crypto"

[features]
default = []

[dependencies]
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
