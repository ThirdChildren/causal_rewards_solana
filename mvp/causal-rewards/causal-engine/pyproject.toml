[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crp-causal-engine"
version = "0.1.0"
description = "Causal Rewards Protocol — deterministic causal engine and reward compiler (M3)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy==2.1.3",
    "scipy==1.14.1",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
crp-engine = "crp_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
